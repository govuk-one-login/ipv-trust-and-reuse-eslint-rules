name: build
description: Builds the library
runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Lint library
      shell: bash
      run: npm run lint

    - name: Package library
      shell: bash
      run: npm pack
