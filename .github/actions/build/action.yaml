name: build
description: Builds the library
runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Lint library
      shell: bash
      run: npm run lint

    - name: Package library
      shell: bash
      run: npm pack
